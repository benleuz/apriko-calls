<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anrufliste</title>
<script src="msal.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --paper: #f3f6f4;
    --sheet: #ffffff;
    --ink: #17221f;
    --ink-dim: #6b7d77;
    --line: #dfe6e2;
    --green: #1f7a4d;
    --green-soft: #e4f3ea;
    --lime: #b8e986;
    --demo: #0f5c8c;
    --demo-soft: #e0eef7;
    --amber: #f4c95d;
    --amber-soft: #fdf3d6;
    --red: #d9534f;
    --red-soft: #fbe5e4;
    --font: "Avenir Next", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; }
  a { color: var(--green); }
  button { font: inherit; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  /* Kopf */
  header { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
  .bar { max-width: 960px; margin: 0 auto; padding: 14px 20px 10px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .bar h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .bar .who { color: var(--ink-dim); font-size: 14px; margin-left: auto; display: flex; gap: 12px; align-items: center; }
  .bar .who button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; color: var(--ink); }
  .tools { max-width: 960px; margin: 0 auto; padding: 0 20px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tools input[type=search] { flex: 1 1 220px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); font-size: 16px; }
  .tools .filt { display: flex; gap: 4px; }
  .tools .filt button { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--ink-dim); }
  .tools .filt button[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .progress { height: 4px; background: var(--line); }
  .progress > div { height: 100%; background: var(--green); width: 0; transition: width .3s; }

  /* Liste – kompakt, eine Zeile pro Firma */
  main { max-width: 1280px; margin: 0 auto; padding: 12px 20px 80px; }
  .count { color: var(--ink-dim); font-size: 14px; margin: 0 0 8px; }
  .hdr, .row { display: grid; grid-template-columns: 22px minmax(180px, 1.4fr) minmax(110px, .8fr) minmax(120px, .9fr) 150px minmax(130px, .9fr) minmax(180px, 1.6fr); gap: 6px 10px; align-items: center; }
  .hdr { padding: 0 10px 6px; font-size: 13px; color: var(--ink-dim); }
  .row { background: var(--sheet); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 6px; padding: 6px 10px; margin-bottom: 4px; }
  .row.s-erreicht { border-left-color: var(--green); }
  .row.s-nochmals { border-left-color: var(--amber); }
  .row.s-demo { border-left-color: var(--demo); background: var(--demo-soft); }
  .row.s-uebergeben { border-left-color: var(--demo); }
  .row select.st-demo, .row select.st-uebergeben { background: var(--demo); color: #fff; border-color: var(--demo); font-weight: 600; }
  .row .demo-date { grid-column: 5 / -1; display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--demo); }
  .row .demo-date input { width: auto; }
  .row.s-kein { border-left-color: var(--red); opacity: .75; }
  .row.s-ignoriert { border-left-color: var(--ink-dim); opacity: .5; }
  .row .name { font-weight: 600; font-size: 15px; line-height: 1.25; }
  .row .id { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); display: block; }
  .row .ort { color: var(--ink-dim); font-size: 14px; }
  .row .web { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row select, .row input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--paper); font-size: 14px; min-height: 34px; }
  .row select:focus, .row input:focus { background: var(--sheet); }
  .row select.st-erreicht { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .row select.st-nochmals { background: var(--amber-soft); color: #7a5a00; border-color: var(--amber); }
  .row select.st-kein { background: var(--red-soft); color: var(--red); border-color: var(--red); }
  .row select.st-ignoriert { background: var(--line); color: var(--ink-dim); }
  .row .demo-date { grid-column: 6 / -1; }
  .hdr input, .row input[type=checkbox] { width: 16px; height: 16px; min-height: 0; margin: 0; padding: 0; accent-color: var(--green); }
  .bulk { position: sticky; bottom: 0; z-index: 4; background: var(--ink); color: #fff; border-radius: 8px; padding: 10px 14px; margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }
  .bulk select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 0; }
  .bulk button { font: inherit; background: var(--lime); color: var(--ink); border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 600; }
  .bulk .x { background: transparent; color: #fff; border: 1px solid #ffffff55; font-weight: 400; margin-left: auto; }
  .row .meta { grid-column: 1 / -1; font-size: 12px; color: var(--ink-dim); display: none; }
  .row .meta.saving, .row .meta.saved, .row .meta.err { display: block; }
  .row .meta.saved { color: var(--green); }
  .row .meta.err { color: var(--red); }
  @media (max-width: 900px) {
    .hdr { display: none; }
    .row { grid-template-columns: 22px 1fr 1fr; }
    .row .name, .row .web { grid-column: 2 / -1; }
    .row .demo-date { grid-column: 2 / -1; }
    .row .name { font-size: 16px; }
  }

  /* Login / Leerzustand */
  .gate { max-width: 420px; margin: 18vh auto; padding: 0 20px; text-align: center; }
  .gate h1 { font-size: 26px; font-weight: 600; margin: 0 0 8px; }
  .gate p { color: var(--ink-dim); margin: 0 0 22px; }
  .gate button, .empty button { background: var(--green); color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 16px; font-weight: 600; }
  .empty { background: var(--sheet); border: 1px dashed var(--line); border-radius: 8px; padding: 30px; text-align: center; color: var(--ink-dim); }
  .empty p { margin: 0 0 14px; }
  .error { background: var(--red-soft); color: #7a2320; border-radius: 8px; padding: 12px 14px; margin: 12px 0; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .admin { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-dim); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .admin button, .admin label { border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 6px 10px; color: var(--ink); cursor: pointer; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Anrufliste</h1>
  <p>Melde dich mit deinem Zugang an, um die Firmenliste zu sehen.</p>
  <button onclick="login()">Anmelden</button>
  <div class="error hidden" id="gate-error"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="bar">
      <h1>Anrufliste</h1>
      <div class="who"><span id="who"></span><button onclick="logout()">Abmelden</button></div>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Firma, Ort, ID suchen" autocomplete="off">
      <div class="filt" id="filt">
        <button data-f="alle" aria-pressed="true">Alle</button>
        <button data-f="offen" aria-pressed="false">Offen</button>
        <button data-f="nochmals" aria-pressed="false">Nochmals</button>
        <button data-f="erledigt" aria-pressed="false">Erledigt</button>
        <button data-f="demo" aria-pressed="false">Demos</button>
        <button data-f="ignoriert" aria-pressed="false">Ignoriert</button>
      </div>
    </div>
    <div class="progress"><div id="prog"></div></div>
  </header>
  <main>
    <div class="error hidden" id="app-error"></div>
    <p class="count" id="count"></p>
    <div class="hdr" id="hdr"><input type="checkbox" id="selall" title="Alle angezeigten auswählen"><span>Firma</span><span>Region · Ort</span><span>Website</span><span>Status</span><span>Ansprechperson</span><span>Kommentar</span></div>
    <div id="list"></div>
    <div class="bulk hidden" id="bulk">
      <span id="bulk-n"></span>
      <select id="bulk-status"></select>
      <button onclick="bulkApply()">Auf alle anwenden</button>
      <button class="x" onclick="clearSel()">Auswahl aufheben</button>
    </div>
    <div class="admin hidden" id="admin">
      <span>Liste verwalten:</span>
      <label>Excel importieren <input type="file" id="xlsx" accept=".xlsx,.xls,.csv" class="hidden"></label>
      <button onclick="exportCsv()">Kommentare als CSV</button>
      <span id="admin-info"></span>
    </div>
  </main>
</div>

<script>
/* ===========================================================
   Konfiguration – eigenständige App, unabhängig vom CRM.
   clientId:  Client-ID der eigenen App-Registrierung «Anrufliste»
   folderUrl: Freigabelink des OneDrive-Ordners, der mit dem Sales
              geteilt ist («Link kopieren» im OneDrive).
              Leer lassen = Ordner "Anrufliste" im eigenen OneDrive
              (funktioniert nur für den Besitzer, nicht für den Gast).
   admins:    Adressen, die importieren/exportieren dürfen
   =========================================================== */
const CONFIG = {
  clientId:   "6bf12aa2-e0a3-4e0d-9529-02f85fcd9b4f",
  tenantId:   "fad1fc7e-4003-4f4b-8b52-9a667ed0ac2e",
  folderUrl:  "",
  folderName: "Anrufliste",
  fileName:   "anrufliste.json",
  admins:     ["benjamin@apriko.com"]
};
const STATUS = [
  ["offen",    "Offen"],
  ["erreicht", "Erreicht"],
  ["demo",     "Demo vereinbart!"],
  ["uebergeben","An Apriko übergeben"],
  ["nochmals", "Nochmals anrufen"],
  ["kein",     "Kein Interesse"],
  ["ignoriert","Ignorieren"]
];

/* ---------- MSAL ---------- */
const msalConfig = {
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: window.location.href.split("?")[0].split("#")[0]
  },
  cache: { cacheLocation: "sessionStorage" }
};
const SCOPES = ["Files.ReadWrite.All", "User.Read"];
let msalApp = null, account = null;

async function init() {
  if (CONFIG.clientId.startsWith("PASTE")) { showGateError("Konfiguration fehlt: clientId im <script>-Block eintragen."); return; }
  try {
    msalApp = new msal.PublicClientApplication(msalConfig);
    await msalApp.initialize();
    const r = await msalApp.handleRedirectPromise();
    if (r && r.account) account = r.account;
    if (!account) { const a = msalApp.getAllAccounts(); if (a.length) account = a[0]; }
    if (account) await startApp();
  } catch (e) { showGateError("Anmeldung fehlgeschlagen: " + e.message); }
}
async function login() {
  try { await msalApp.loginRedirect({ scopes: SCOPES }); }
  catch (e) { showGateError("Anmeldung fehlgeschlagen: " + e.message); }
}
function logout() { msalApp.logoutRedirect(); }
async function getToken() {
  try { return (await msalApp.acquireTokenSilent({ scopes: SCOPES, account })).accessToken; }
  catch (e) { return (await msalApp.acquireTokenPopup({ scopes: SCOPES })).accessToken; }
}

/* ---------- Graph ---------- */
async function graph(path, opts = {}) {
  const token = await getToken();
  const res = await fetch("https://graph.microsoft.com/v1.0" + path, {
    ...opts,
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json", ...(opts.headers || {}) }
  });
  if (!res.ok) throw new Error(`Graph ${res.status}: ${await res.text()}`);
  if (res.status === 204) return null;
  const ct = res.headers.get("content-type") || "";
  return ct.includes("json") ? res.json() : res.text();
}

let folder = null;   // { driveId, itemId }
async function resolveFolder() {
  if (CONFIG.folderUrl) {
    const enc = "u!" + btoa(CONFIG.folderUrl).replace(/=+$/, "").replace(/\//g, "_").replace(/\+/g, "-");
    const item = await graph(`/shares/${enc}/driveItem`);
    folder = { driveId: item.parentReference.driveId, itemId: item.id };
  } else {
    const drive = await graph(`/me/drive`);
    let item;
    try { item = await graph(`/me/drive/root:/${encodeURIComponent(CONFIG.folderName)}`); }
    catch (e) {
      item = await graph(`/me/drive/root/children`, { method: "POST",
        body: JSON.stringify({ name: CONFIG.folderName, folder: {}, "@microsoft.graph.conflictBehavior": "fail" }) });
    }
    folder = { driveId: drive.id, itemId: item.id };
  }
}
const filePath = () => `/drives/${folder.driveId}/items/${folder.itemId}:/${encodeURIComponent(CONFIG.fileName)}:/content`;
async function loadData() {
  try { const d = await graph(filePath()); return typeof d === "string" ? JSON.parse(d) : d; }
  catch (e) { if (/404/.test(e.message)) return { companies: [] }; throw e; }
}
async function saveData(d) {
  d.updated = new Date().toISOString();
  await graph(filePath(), { method: "PUT", body: JSON.stringify(d, null, 1) });
}

/* ---------- App ---------- */
let data = { companies: [] };
let filter = "alle", query = "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function showGateError(m) { $("gate-error").textContent = m; $("gate-error").classList.remove("hidden"); }
function showError(m) { $("app-error").textContent = m; $("app-error").classList.remove("hidden"); }
const isAdmin = () => CONFIG.admins.map(a => a.toLowerCase()).includes((account?.username || "").toLowerCase());

async function startApp() {
  $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
  $("who").textContent = account.name || account.username;
  if (isAdmin()) $("admin").classList.remove("hidden");
  try { await resolveFolder(); data = await loadData(); }
  catch (e) { showError("Liste konnte nicht geladen werden.\n" + e.message + "\n\nIst der OneDrive-Ordner mit dir geteilt und die folderUrl korrekt?"); }
  render();
}

function visible() {
  const q = query.trim().toLowerCase();
  return data.companies.filter(c => {
    const s = c.status || "offen";
    if (filter === "offen" && s !== "offen") return false;
    if (filter === "nochmals" && s !== "nochmals") return false;
    if (filter === "erledigt" && !(s === "erreicht" || s === "kein" || s === "demo" || s === "uebergeben")) return false;
    if (filter === "ignoriert" && s !== "ignoriert") return false;
    if (filter === "demo" && !(s === "demo" || s === "uebergeben")) return false;
    if (filter === "alle" && s === "ignoriert") return false;
    if (!q) return true;
    return [c.name, c.city, c.region, c.id, c.comment, c.contact].some(v => String(v ?? "").toLowerCase().includes(q));
  });
}

function render() {
  const all = data.companies, done = all.filter(c => c.status && c.status !== "offen").length;
  $("prog").style.width = all.length ? (100 * done / all.length) + "%" : "0";
  const rows = visible();
  const demos = all.filter(c => c.status === "demo" || c.status === "uebergeben").length;
  $("count").textContent = all.length ? `${rows.length} von ${all.length} Firmen · ${done} bearbeitet · ${demos} Demo${demos === 1 ? "" : "s"}` : "";
  const list = $("list");
  if (!all.length) {
    list.innerHTML = `<div class="empty"><p>Noch keine Firmen in der Liste.</p>${isAdmin() ? "<p>Importiere unten das Excel mit den Firmen.</p>" : "<p>Bitte bei Apriko melden – die Liste wurde noch nicht hochgeladen.</p>"}</div>`;
    return;
  }
  $("hdr").classList.toggle("hidden", !rows.length);
  list.innerHTML = rows.map(c => {
    const s = c.status || "offen";
    const ort = [c.region, c.city].filter(Boolean).join(" · ");
    const web = c.website ? `<a class="web" href="${esc(/^https?:/i.test(c.website) ? c.website : "http://" + c.website)}" target="_blank" rel="noopener" title="${esc(c.website)}">${esc(c.website.replace(/^https?:\/\//i, "").replace(/^www\./i, "").replace(/\/$/, ""))}</a>` : "<span></span>";
    const meta = c.updatedBy ? esc(c.updatedBy) + ", " + new Date(c.updatedAt).toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" }) : "";
    return `<div class="row s-${s}" data-id="${esc(c.id)}" title="${meta}">
      <input type="checkbox" ${sel.has(String(c.id)) ? "checked" : ""} onchange="toggleSel('${esc(c.id)}', this.checked)">
      <div><span class="name">${esc(c.name)}</span><span class="id">${esc(c.id)}</span></div>
      <div class="ort">${esc(ort)}</div>${web}
      <select class="st-${s}" onchange="setStatus('${esc(c.id)}', this.value)">${STATUS.map(([k, l]) => `<option value="${k}"${s === k ? " selected" : ""}>${l}</option>`).join("")}</select>
      <input type="text" placeholder="Name der Ansprechperson" value="${esc(c.contact)}" onblur="setField('${esc(c.id)}','contact',this.value)">
      <input type="text" placeholder="Kommentar zum Gespräch" value="${esc(c.comment)}" onblur="setField('${esc(c.id)}','comment',this.value)">
      ${(s === "demo" || s === "uebergeben") ? `<div class="demo-date"><span>Demo am</span><input type="datetime-local" value="${esc(c.demoAt)}" onchange="setField('${esc(c.id)}','demoAt',this.value)"><span>${s === "demo" ? "→ Apriko meldet sich zur Übernahme" : "✓ übernommen"}</span></div>` : ""}
      <div class="meta"></div>
    </div>`;
  }).join("") || `<div class="empty"><p>Keine Firma passt zu Suche und Filter.</p></div>`;
  updateBulk();
}

/* ---------- Mehrfachauswahl / Massenaktion ---------- */
const sel = new Set();
function toggleSel(id, on) { on ? sel.add(String(id)) : sel.delete(String(id)); updateBulk(); }
function clearSel() { sel.clear(); render(); }
function updateBulk() {
  const vis = visible();
  $("selall").checked = vis.length > 0 && vis.every(c => sel.has(String(c.id)));
  $("bulk").classList.toggle("hidden", sel.size === 0);
  $("bulk-n").textContent = sel.size + (sel.size === 1 ? " Firma ausgewählt:" : " Firmen ausgewählt:");
}
$("selall").addEventListener("change", e => {
  visible().forEach(c => e.target.checked ? sel.add(String(c.id)) : sel.delete(String(c.id)));
  render();
});
$("bulk-status").innerHTML = STATUS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
$("bulk-status").value = "ignoriert";
async function bulkApply() {
  const st = $("bulk-status").value, ids = new Set(sel);
  $("bulk-n").textContent = "Speichern …";
  try {
    const fresh = await loadData();
    const who = account.name || account.username, now = new Date().toISOString();
    fresh.companies.forEach(c => { if (ids.has(String(c.id))) Object.assign(c, { status: st, updatedBy: who, updatedAt: now }); });
    await saveData(fresh);
    data = fresh; sel.clear(); render();
  } catch (e) { showError("Massenaktion nicht gespeichert: " + e.message); updateBulk(); }
}

/* Speichern: immer frisch laden, nur die eine Firma ändern, zurückschreiben */
let saveChain = Promise.resolve();
function persist(id, patch) {
  const metaEl = () => document.querySelector(`.row[data-id="${CSS.escape(id)}"] .meta`);
  let meta = metaEl();
  if (meta) { meta.textContent = "Speichern …"; meta.className = "meta saving"; }
  saveChain = saveChain.then(async () => {
    try {
      const fresh = await loadData();
      const c = fresh.companies.find(x => String(x.id) === String(id));
      if (!c) throw new Error("Firma nicht mehr in der Liste");
      Object.assign(c, patch, { updatedBy: account.name || account.username, updatedAt: new Date().toISOString() });
      await saveData(fresh);
      data = fresh; meta = metaEl();
      if (meta) { meta.textContent = "Gespeichert"; meta.className = "meta saved"; }
      const all = data.companies, done = all.filter(x => x.status && x.status !== "offen").length;
      $("prog").style.width = (100 * done / all.length) + "%";
      const demos = all.filter(x => x.status === "demo" || x.status === "uebergeben").length;
      $("count").textContent = `${visible().length} von ${all.length} Firmen · ${done} bearbeitet · ${demos} Demo${demos === 1 ? "" : "s"}`;
    } catch (e) {
      meta = metaEl();
      if (meta) { meta.textContent = "Nicht gespeichert: " + e.message; meta.className = "meta err"; }
    }
  });
}
function setStatus(id, s) {
  const c = data.companies.find(x => String(x.id) === String(id)); if (!c) return;
  c.status = s;
  const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  row.className = "row s-" + s;
  row.querySelector("select").className = "st-" + s;
  persist(id, { status: s });
  if (s === "demo" || s === "uebergeben" || row.querySelector(".demo-date")) render();
}
function setField(id, k, v) {
  const c = data.companies.find(x => String(x.id) === String(id)); if (!c) return;
  if ((c[k] || "") === v) return;
  c[k] = v;
  persist(id, { [k]: v });
}

/* ---------- Suche / Filter ---------- */
$("q").addEventListener("input", e => { query = e.target.value; render(); });
$("list").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.tagName === "INPUT") e.target.blur(); });
$("filt").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  $("filt").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

/* ---------- Admin: Excel-Import (mergt nach ID, Kommentare bleiben) ---------- */
$("xlsx").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
    const key = (r, ...names) => { for (const n of names) { const k = Object.keys(r).find(k => k.trim().toLowerCase() === n); if (k) return String(r[k]).trim(); } return ""; };
    const byId = new Map(data.companies.map(c => [String(c.id), c]));
    let added = 0, updated = 0;
    for (const r of rows) {
      const id = key(r, "custom ( id", "custom (id", "id", "custom_id"); const name = key(r, "name");
      if (!id && !name) continue;
      const rec = { id: id || name, name, region: key(r, "region"), city: key(r, "city", "ort"), website: key(r, "website") };
      const ex = byId.get(String(rec.id));
      if (ex) { Object.assign(ex, rec); updated++; } else { data.companies.push({ ...rec, status: "offen", contact: "", comment: "" }); added++; }
    }
    await saveData(data);
    $("admin-info").textContent = `${added} neu, ${updated} aktualisiert`;
    render();
  } catch (err) { showError("Import fehlgeschlagen: " + err.message); }
  e.target.value = "";
});
function exportCsv() {
  const cols = ["id", "name", "region", "city", "website", "status", "demoAt", "contact", "comment", "updatedBy", "updatedAt"];
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const csv = [cols.join(";"), ...data.companies.map(c => cols.map(k => q(c[k])).join(";"))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" })); a.download = "anrufliste.csv"; a.click();
}

init();
